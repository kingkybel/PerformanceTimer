<svg width="1600" height="400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PerformanceTimer banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F5F3D"/>
      <stop offset="100%" stop-color="#1C8B52"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0.05"/>
