  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>

  <circle cx="220" cy="390" r="280" fill="#052E1E" fill-opacity="0.25"/>
  <circle cx="1430" cy="60" r="180" fill="url(#halo)"/>
  <circle cx="980" cy="320" r="140" fill="#14532D" fill-opacity="0.22"/>

  <g transform="translate(110, 205)">
